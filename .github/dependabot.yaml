# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      dependencies:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: /example/Example1
    schedule:
      interval: daily

  - package-ecosystem: nuget
    directory: /example/OpenTelemetryExample
    schedule:
      interval: daily

  - package-ecosystem: nuget
    directory: /src/OpenFga.Sdk.Test
    schedule:
      interval: daily

  - package-ecosystem: nuget
    directory: /src/OpenFga.Sdk
    schedule:
      interval: daily
